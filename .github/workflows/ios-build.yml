name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.ts'

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup CocoaPods Repo
        run: pod repo update

      - name: Sync Capacitor iOS
        run: npx cap sync ios --verbose

      - name: Build Unsigned iOS App
        run: |
          cd ios/App
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' App.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' App.xcodeproj/project.pbxproj || true
          
          # Build without requiring codesigning
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package into IPA
        run: |
          cd ios/App
          mkdir -p Payload
          # Move the compiled app into the Payload folder
          mv build/Release-iphoneos/App.app Payload/
          # Zip it up to create the IPA file
          zip -r Elly-SmartHome.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elly-iOS-App
          path: ios/App/Elly-SmartHome.ipa
          retention-days: 7
